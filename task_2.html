<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 - Task 2: Conference Registration Form</title>
</head>
<body>
  <h1>Conference Registration Form</h1>

  <form action="#" method="post">

    <label for="fullname">Full Name:</label><br>
    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br>

    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email address" required><br>

    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age" min="18" max="99" placeholder="18" required>
    <br><br>

    <p>Gender:</p>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label><br>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <br><br>

    <label for="country">Country of Residence:</label><br>
    <select id="country" name="country">
      <option value="malaysia" selected>Malaysia</option>
      <option value="singapore">Singapore</option>
      <option value="indonesia">Indonesia</option>
      <option value="thailand">Thailand</option>
      <option value="brunei">Brunei</option>
      <option value="other">Other</option>
    </select>
    <br><br>

    <p>Areas of Interest:</p>
    <input type="checkbox" id="softdev" name="interest" value="software-development">
    <label for="softdev">Software Development</label><br>
    <input type="checkbox" id="datasci" name="interest" value="data-science">
    <label for="datasci">Data Science</label><br>
    <input type="checkbox" id="cyber" name="interest" value="cybersecurity">
    <label for="cyber">Cybersecurity</label><br>
    <input type="checkbox" id="ai" name="interest" value="artificial-intelligence">
    <label for="ai">Artificial Intelligence</label>
    <br><br>

    <p>Experience Level:</p>
    <input type="radio" id="beginner" name="experience" value="beginner">
    <label for="beginner">Beginner</label><br>
    <input type="radio" id="intermediate" name="experience" value="intermediate">
    <label for="intermediate">Intermediate</label><br>
    <input type="radio" id="advanced" name="experience" value="advanced">
    <label for="advanced">Advanced</label>
    <br><br>

    <label for="comments">Comments or Questions:</label><br>
    <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Any comments or questions?"></textarea>
    <br>

    <input type="submit" value="Register">
    <input type="reset" value="Reset">

  </form>
</body>
</html>
